<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!--Phần header-->
<header class="navbar">
    <div class="navbar-left">
        <img src="images/logo.png" alt="CookHub Logo" class="logo">
        <h1>Cook<span class="highlight">Hub</span></h1>
    </div>
    <button id="login-btn" class="login-btn">Đăng nhập</button>
</header>

<!--Phần hero-->
<section class="hero">
    <img src="images/mainpage.jpg" alt="Món ăn chính" class="hero-bg">
    <div class="hero-text">
        <h1>Cook<span class="highlight">Hub</span></h1>
        <h2>Anyone can <span class="highlight">cook</span></h2>
    </div>
</section>
  
<!--Phần footer-->
<footer class="footer">
    <div class="footer-left">
        <h3>Cook<span class="highlight">Hub</span></h3>
        <p>Theo đuổi ước mơ của bạn</p>
    </div>
</footer>

<!--Chuyển sang trang đăng nhập-->
<script>
    window.addEventListener("load", function() {
        document.body.classList.add("loaded");
    });

    const loginButton = document.getElementById("login-btn");
    loginButton.addEventListener("click", function() {
        document.body.style.opacity = 0;
        setTimeout(() => {
            window.location.href = "login.html";
        }, 600);
    });
</script>

</body>
</html>
