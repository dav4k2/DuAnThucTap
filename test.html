<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!--Phần header-->
<header class="navbar">
    <div class="navbar_left">
        <img src="images/logo.png" alt="CookHub Logo" class="logo">
        <h1>Cook<span class="highlight">Hub</span></h1>
    </div>
    <button id="login_btn" class="login_btn">Đăng nhập</button>

  </header>

<!--Phần hero-->
<section class="hero">
    <img src="images/mainpage.jpg" alt="Món ăn chính" class="hero_bg">
    <div class="hero_text">
        <h1>Cook<span class="highlight">Hub</span></h1>
        <h2>Anyone can <span class="highlight">cook</span></h2>
    </div>
</section>
  
<!--Phần footer-->
<footer class="footer">
    <div class="footer_left">
        <h3>Cook<span class="highlight">Hub</span></h3>
        <p>Theo đuổi ước mơ của bạn</p>
        <div class="socials">
            <a href="#"><img src="images/ig.png" alt="Instagram"></a>
            <a href="#"><img src="images/linkedin.png" alt="LinkedIn"></a>
            <a href="#"><img src="images/x.png" alt="X"></a>
        </div>
    </div>

    <div class="footer_right">
        <div class="footer_col">   
            <h4>Tính năng</h4>
            <ul>
                <li>Thống kê số liệu</li>
                <li>Quản lý công thức</li>
            </ul>
      </div>
      <div class="footer_col">
            <h4>Về chúng tôi</h4>
            <ul>
                <li>Sự nghiệp</li>
                <li>Quá trình phát triển</li>
            </ul>
      </div>
      <div class="footer_col">
            <h4>Hỗ trợ</h4>
            <ul>
                <li>Liên hệ</li>
                <li>Điều khoản</li>
                <li>Chính sách</li>
                <li>Gửi phiếu hỗ trợ</li>
            </ul>
      </div>
    </div>
</footer>

<!--Chuyển sang trang đăng nhập-->
<script>
    //Test hiệu ứng chuyển trang
    window.addEventListener("load", function() 
    {
        document.body.classList.add("loaded");
    });

    //Lấy sự kiện ấn nút "Đăng nhập"
    const loginButton = document.getElementById("login_btn");
    loginButton.addEventListener("click", function() 
    {
        //Hiệu ứng faded
        document.body.style.opacity = 0;
        //Set thời gian hiệu ứng
        setTimeout(() => 
        {
            window.location.href = "login.html";
        }, 600); //Hiện tại đang là 600ms
    });
</script>

</body>
</html>
