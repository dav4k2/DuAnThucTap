<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CookHub - Đăng nhập</title>
  <link rel="stylesheet" href="css/login.css">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  
  <script src="js/login.js" defer></script>
  <script src="js/config.js"></script>
</head>

<body>

    <div class="background">
        <img src="images/login.jpg" class="bg_img">
    </div>

    <div class="back_btn">
        <a href="index.html"><img src="images/back.png" id="back_btn"></a>
    </div>

    <div class="login_container">
        <div class="login_form">
            <div class="logo_title">
                <img src="images/logo.png" alt="Logo" class="logo">
                <h1>Đăng nhập</h1>
            </div>

            <label>Email</label>
            <input type="text" id="email" placeholder="Email" spellcheck="false"">

            <label>Mật khẩu</label>
            <div class="password_field">
                <input type="password" id="password" placeholder="Password">
                <img src="images/show.png" id="show_password" class="show_password">
            </div>

            <button class="login_btn" type="button" onclick="handleLogin()">
                Đăng nhập
            </button>
        </div>
    </div>

    <script>
        window.addEventListener("load", () => {
            document.body.classList.add("loaded");
        });
    </script>
</body>
</html>
